name: Pull from ServiceNow

# Manually triggered — pulls SN DEV changes back into mydev as Fluent source code.
# nowdev/prod are deploy-only targets; they always receive code from mydev via PR.

on:
  workflow_dispatch:

jobs:
  pull:
    name: Pull DEV → mydev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout mydev
        uses: actions/checkout@v4
        with:
          ref: mydev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate now-sdk to DEV
        run: |
          echo "${{ secrets.SN_DEV_PASS }}" | npx now-sdk auth \
            --add "${{ secrets.SN_DEV_INSTANCE }}" \
            --type basic \
            --alias dev \
            --username "${{ secrets.SN_DEV_USER }}" \
            --password-stdin

      - name: Transform from DEV → src/
        run: npx now-sdk transform --auth dev

      - name: Commit and push to mydev
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git diff --cached --quiet && echo "No changes pulled from SN" && exit 0
          git commit -m "chore: pull from SN dev [skip ci]"
          git push origin mydev
